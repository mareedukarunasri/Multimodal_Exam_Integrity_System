<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exam Camera Monitoring</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
        }

        video {
            width: 640px;
            max-width: 95%;
            border: 3px solid #333;
            border-radius: 10px;
            background: black;
        }

        button {
            padding: 10px 20px;
            margin: 10px 5px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 6px;
            border: none;
        }

        #startCamera {
            background: #28a745;
            color: white;
        }

        #stopCamera {
            background: #dc3545;
            color: white;
        }

        .status {
            margin-top: 20px;
            font-size: 18px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <h1>Exam Camera Monitoring</h1>

    <video id="camera" autoplay muted playsinline></video>

    <br>

    <button id="startCamera">Start Camera</button>
    <button id="stopCamera">Stop Camera</button>

    <div class="status">

        <p id="cameraStatus">
            Camera is not running.
        </p>

        <p>
            Faces detected:
            <span id="faceCount">0</span>
        </p>

        <p>
            Head Movement:
            <span id="headMovement">Not active</span>
        </p>

        <p>
            Mobile Phone:
            <span id="phoneStatus">Not detected</span>
        </p>

        <p>
            Backend:
            <span id="backendStatus">Not connected</span>
        </p>

        <p>
            Voice Warning:
            <span id="voiceStatus">Not active</span>
        </p>

        <p>
            Siren:
            <span id="sirenStatus">Not active</span>
        </p>

    </div>


    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

    <!-- COCO-SSD Mobile Phone/Object Detection -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

    <!-- Face Detection -->
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>


    <!-- Your Camera Monitoring JavaScript -->
    <script src="../src/monitoring/camera_monitor.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

    <script src="../monitoring/CameraMonitor.js"></script>

</body>
</html>

</body>
</html>
